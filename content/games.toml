# One [[games]] entry per game, in the order they appear on the site.
#
# Images live in content/games/<id>/ and are found automatically:
#   icon.png|jpg          square app icon (512x512)
#   cover.jpg             landscape art, 16:9 (cards, game page header, sharing image)
#   poster.jpg            optional portrait art, 2:3 (home page hero)
#   screenshots/*.jpg     shown in file-name order
#   loop.mp4 + loop.webm + loop.jpg   optional gameplay loop, made by: python build.py --loops
#
# Fields:
#   id                 folder name and page address: /games/<id>/
#   name, tagline      as on the store
#   description        paragraphs separated by a blank line
#   release_date       YYYY-MM-DD (leave out if not released yet)
#   genre
#   status             "live" (store buttons), "coming_soon" (pre-registration badge), "hidden" (not shown)
#   featured           true = shown big on the home page
#   google_play_url, app_store_url (leave out if not on that store)
#   youtube_trailers   video IDs, played one after another
#   youtube_playlist   playlist ID for the "More videos" link
#   youtube_shorts     Short IDs shown as tap-to-play videos (best first)
#   loop_start         optional: seconds into the original video where the gameplay loop starts
#   loop_seconds       optional: loop length, 5 to 12 (default 8)

[[games]]
id = "gravity-switch"
name = "Gravity Switch: Block Puzzle"
tagline = "Swipe to switch gravity, slide crates and set off huge chain matches!"
description = """
Swipe once and the whole board moves. Gravity Switch is a fresh block puzzle where you control gravity itself: swipe up, down, left or right and every crate slides to that side. Line up 3 or more of the same color to clear them, then watch the crates above tumble in and set off chain after chain.

Every swipe matters. After each move a new crate slides in from the far edge, so plan ahead, keep the board from filling up, and finish your goals before you run out of moves. 100 levels across 4 worlds, with TNT, glue, one-way gates and hidden secrets to find.
"""
genre = "Puzzle"
status = "coming_soon"
featured = true
google_play_url = "https://play.google.com/store/apps/details?id=com.tnodes.gravity.switch.cube.puzzle"

